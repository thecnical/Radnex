name: Bug Report
description: Report an issue or unexpected behavior in Radnex
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible.
  - type: input
    id: version
    attributes:
      label: Radnex Version
      description: What version of Radnex are you using? (e.g., v1.0.0 or commit SHA)
      placeholder: "v1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What OS are you running Radnex on?
      options:
        - Kali Linux
        - Ubuntu / Debian
        - Arch Linux / Fedora
        - macOS
        - Windows (WSL2)
        - Docker
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: AI Provider / Gateway
      description: Which provider were you using when the issue occurred?
      options:
        - AntSeed (P2P Buyer)
        - APInex AI
        - Radox AI
        - UnoRouter
        - AIHubMix
        - OpenRouter
        - TokenHarbour
        - Local Proxy (Logfare / Token Juice)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `radnex --mode cpss`
        2. Execute `/antseed ...`
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Terminal Output
      description: Paste any terminal logs or stack traces here.
      render: shell
