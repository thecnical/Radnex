name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Run Regression Test Suite
      run: |
        python -c "
        import subprocess, sys, pathlib
        tests = sorted(pathlib.Path('tests').glob('test_*.py'))
        failures = []
        for t in tests:
            res = subprocess.run([sys.executable, str(t)], capture_output=True, text=True)
            if res.returncode != 0:
                print(f'FAIL: {t.name}')
                failures.append((t.name, res.stdout, res.stderr))
            else:
                print(f'PASS: {t.name}')
        if failures:
            for name, out, err in failures:
                print('='*50)
                print(f'FAILURE in {name}:')
                print(out)
                print(err)
            sys.exit(1)
        print(f'\nAll {len(tests)} test suites passed successfully!')
        "
