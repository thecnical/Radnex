<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="1100" height="540" role="img" aria-label="RADNEX 3D Multi-Tier Architecture">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#040805"/>
      <stop offset="100%" stop-color="#010302"/>
    </linearGradient>
    
    <!-- Plate Gradients with 3D Depth -->
    <linearGradient id="plateGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#05250f" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="plateGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#02242e" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="plateGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb000" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#301d00" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Side Depth Gradients -->
    <linearGradient id="side1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00330d" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="side2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#002029" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="side3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#331e00" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <style>
    .title-main { font: 700 17px ui-monospace, Menlo, Consolas, monospace; fill: #00ff41; letter-spacing: 2px; }
    .title-sub { font: 12px ui-monospace, Menlo, Consolas, monospace; fill: #5c8a66; letter-spacing: 1.2px; }
    .layer-title { font: 700 13px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 1.5px; }
    .layer-sub { font: 11px ui-monospace, Menlo, Consolas, monospace; fill: #a5d6a7; letter-spacing: 0.5px; }
    .bus-text { font: 10px ui-monospace, Menlo, Consolas, monospace; fill: #719b78; letter-spacing: 1px; }
    .cap-title { font: 700 12px ui-monospace, Menlo, Consolas, monospace; fill: #ffffff; letter-spacing: 1px; }
    .cap-sub { font: 11px ui-monospace, Menlo, Consolas, monospace; fill: #7a9c80; }
    .flow-line { stroke-dasharray: 6 4; animation: flow 8s linear infinite; }
    @keyframes flow { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
  </style>

  <!-- Canvas Background -->
  <rect width="1100" height="540" fill="url(#bgGrad)" rx="12" stroke="#16331c" stroke-width="1.5"/>
  
  <!-- Subtle Background Grid -->
  <g opacity="0.15">
    <path d="M 0,90 L 1100,90 M 0,180 L 1100,180 M 0,270 L 1100,270 M 0,360 L 1100,360 M 0,450 L 1100,450" stroke="#00ff41" stroke-width="1"/>
    <path d="M 200,0 L 200,540 M 400,0 L 400,540 M 600,0 L 600,540 M 800,0 L 800,540" stroke="#00ff41" stroke-width="1"/>
  </g>

  <!-- Top Header Banner -->
  <text x="45" y="42" class="title-main">◈ RADNEX ARCHITECTURE // 3D MULTI-TIER INTELLIGENCE MESH</text>
  <text x="45" y="65" class="title-sub">ARCHITECTED BY CHANDAN PANDEY (@thecnical) · FULL-SPECTRUM AUTONOMOUS SECURITY ENGINE</text>
  <line x1="45" y1="78" x2="1055" y2="78" stroke="#16331c" stroke-width="1.5"/>

  <!-- ==================== LEFT COLUMN: 3D MULTI-TIER STACK ==================== -->

  <!-- TIER 1: TUI & CONTROL RUNTIME (Top Plate) -->
  <g transform="translate(45, 95)" filter="url(#dropShadow)">
    <!-- 3D Bottom/Extrusion -->
    <polygon points="20,95 490,95 490,105 20,105" fill="url(#side1)"/>
    <!-- Top Isometric/Card Face -->
    <rect x="20" y="15" width="470" height="80" rx="8" fill="url(#plateGrad1)" stroke="#00ff41" stroke-width="1.5"/>
    <!-- Accent Line & Status Indicator -->
    <line x1="20" y1="20" x2="20" y2="90" stroke="#00ff41" stroke-width="4"/>
    <circle cx="42" cy="38" r="6" fill="#00ff41" filter="url(#glowGreen)"/>
    <text x="58" y="42" class="layer-title" fill="#00ff41">TIER 1: TUI &amp; INTERACTIVE CONTROL RUNTIME</text>
    <text x="58" y="62" class="layer-sub">High-FPS Matrix Shell · Multi-Pane tmux Swarms (/panes)</text>
    <text x="58" y="78" class="layer-sub">Real-Time Telemetry · Target Scoping · Git Shadow Checkpoints (/undo)</text>
    <rect x="410" y="28" width="65" height="20" rx="4" fill="#00ff41" fill-opacity="0.15" stroke="#00ff41" stroke-width="1"/>
    <text x="442" y="42" font-family="monospace" font-size="10" font-weight="bold" fill="#00ff41" text-anchor="middle">ACTIVE</text>
  </g>

  <!-- Connection Bus 1 -> 2 -->
  <g transform="translate(280, 195)">
    <line x1="0" y1="0" x2="0" y2="38" stroke="#00ff41" stroke-width="2" class="flow-line"/>
    <polygon points="-5,32 5,32 0,40" fill="#00ff41"/>
    <rect x="15" y="10" width="170" height="18" rx="4" fill="#051509" stroke="#16331c"/>
    <text x="22" y="23" class="bus-text">RECON &amp; TASK DISPATCH BUS</text>
  </g>

  <!-- TIER 2: SMART ROUTER & DUAL-TIER REASONING (Middle Plate) -->
  <g transform="translate(45, 235)" filter="url(#dropShadow)">
    <polygon points="20,95 490,95 490,105 20,105" fill="url(#side2)"/>
    <rect x="20" y="15" width="470" height="80" rx="8" fill="url(#plateGrad2)" stroke="#00e5ff" stroke-width="1.5"/>
    <line x1="20" y1="20" x2="20" y2="90" stroke="#00e5ff" stroke-width="4"/>
    <circle cx="42" cy="38" r="6" fill="#00e5ff" filter="url(#glowCyan)"/>
    <text x="58" y="42" class="layer-title" fill="#00e5ff">TIER 2: SMART ROUTER &amp; HYBRID INTELLIGENCE</text>
    <text x="58" y="62" class="layer-sub" fill="#a5e9f2">Dual-Tier Engine: Fast Scout (Indexing) + Heavy Architect (Analysis)</text>
    <text x="58" y="78" class="layer-sub" fill="#a5e9f2">Anthropic Ephemeral Prompt Caching (90% Cost &amp; Latency Reduction)</text>
    <rect x="410" y="28" width="65" height="20" rx="4" fill="#00e5ff" fill-opacity="0.15" stroke="#00e5ff" stroke-width="1"/>
    <text x="442" y="42" font-family="monospace" font-size="10" font-weight="bold" fill="#00e5ff" text-anchor="middle">HYBRID</text>
  </g>

  <!-- Connection Bus 2 -> 3 -->
  <g transform="translate(280, 335)">
    <line x1="0" y1="0" x2="0" y2="38" stroke="#00e5ff" stroke-width="2" class="flow-line"/>
    <polygon points="-5,32 5,32 0,40" fill="#00e5ff"/>
    <rect x="15" y="10" width="180" height="18" rx="4" fill="#02181f" stroke="#063b47"/>
    <text x="22" y="23" class="bus-text" fill="#5ca6b3">ZERO-DOWNTIME FAILOVER BUS</text>
  </g>

  <!-- TIER 3: ZERO-COST CLOUD GATEWAY MESH (Bottom Plate) -->
  <g transform="translate(45, 375)" filter="url(#dropShadow)">
    <polygon points="20,95 490,95 490,105 20,105" fill="url(#side3)"/>
    <rect x="20" y="15" width="470" height="80" rx="8" fill="url(#plateGrad3)" stroke="#ffb000" stroke-width="1.5"/>
    <line x1="20" y1="20" x2="20" y2="90" stroke="#ffb000" stroke-width="4"/>
    <circle cx="42" cy="38" r="6" fill="#ffb000" filter="url(#glowAmber)"/>
    <text x="58" y="42" class="layer-title" fill="#ffb000">TIER 3: ZERO-COST CLOUD GATEWAY MESH</text>
    <text x="58" y="62" class="layer-sub" fill="#ffe099">APInex · Radox AI · OpenRouter · UnoRouter · AIHubMix</text>
    <text x="58" y="78" class="layer-sub" fill="#ffe099">TokenHarbour · AntSeed · Logfare · Strict 100% Free Pinning</text>
    <rect x="410" y="28" width="65" height="20" rx="4" fill="#ffb000" fill-opacity="0.15" stroke="#ffb000" stroke-width="1"/>
    <text x="442" y="42" font-family="monospace" font-size="10" font-weight="bold" fill="#ffb000" text-anchor="middle">100% FREE</text>
  </g>

  <!-- ==================== RIGHT COLUMN: CAPABILITIES MATRIX ==================== -->
  <g transform="translate(560, 95)" filter="url(#dropShadow)">
    <rect width="495" height="390" rx="10" fill="#050c07" stroke="#16331c" stroke-width="1.5"/>
    
    <!-- Matrix Header -->
    <rect width="495" height="36" rx="10" fill="#0c1f10"/>
    <line x1="0" y1="36" x2="495" y2="36" stroke="#16331c" stroke-width="1"/>
    <text x="20" y="24" font-family="monospace" font-size="12" font-weight="700" fill="#00ff41" letter-spacing="1.5px">⚡ CORE DEFENSIVE &amp; OFFENSIVE CAPABILITIES</text>

    <!-- Capability 1 -->
    <g transform="translate(20, 52)">
      <circle cx="12" cy="14" r="5" fill="#00ff41" filter="url(#glowGreen)"/>
      <text x="28" y="16" class="cap-title">Strict Free-Tier Enforcer (is_strictly_free)</text>
      <text x="28" y="32" class="cap-sub">Guarantees $0.00 spent. Instant failover on 429 rate limits.</text>
    </g>

    <!-- Capability 2 -->
    <g transform="translate(20, 116)">
      <circle cx="12" cy="14" r="5" fill="#00e5ff" filter="url(#glowCyan)"/>
      <text x="28" y="16" class="cap-title">Dual-Tier Hybrid Dispatcher</text>
      <text x="28" y="32" class="cap-sub">Fast scout for indexing + heavy architect for deep reasoning.</text>
    </g>

    <!-- Capability 3 -->
    <g transform="translate(20, 180)">
      <circle cx="12" cy="14" r="5" fill="#ffb000" filter="url(#glowAmber)"/>
      <text x="28" y="16" class="cap-title">Git Shadow Checkpoints &amp; Instant Rollback (/undo)</text>
      <text x="28" y="32" class="cap-sub">Automatic pre-turn commit before any file write or command.</text>
    </g>

    <!-- Capability 4 -->
    <g transform="translate(20, 244)">
      <circle cx="12" cy="14" r="5" fill="#7dffb0"/>
      <text x="28" y="16" class="cap-title">Headless Webhook Reporting Engine (/webhook)</text>
      <text x="28" y="32" class="cap-sub">Real-time milestone dispatches to Discord, Slack &amp; SIEM.</text>
    </g>

    <!-- Capability 5 -->
    <g transform="translate(20, 308)">
      <circle cx="12" cy="14" r="5" fill="#00ff41"/>
      <text x="28" y="16" class="cap-title">Multi-Pane Swarm Orchestration (/panes)</text>
      <text x="28" y="32" class="cap-sub">Parallel autonomous agents communicating via inter-agent mailbox.</text>
    </g>

    <!-- Footer Stats Inside Matrix -->
    <line x1="20" y1="355" x2="475" y2="355" stroke="#16331c" stroke-width="1"/>
    <text x="20" y="373" font-family="monospace" font-size="10" fill="#4d7355" letter-spacing="1px">STATUS: ALL 8 GATEWAYS VERIFIED · ZERO LATENCY STALL · 100% UPTIME</text>
  </g>
</svg>
