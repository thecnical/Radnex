<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-label="RADNEX 3D Architecture">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050a06"/>
      <stop offset="100%" stop-color="#020402"/>
    </linearGradient>
    <linearGradient id="planeGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0c5a22" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="planeGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#005f73" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="planeGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7f5500" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .layer-card { transition: transform 0.3s ease; }
    .node-text { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #ffffff; letter-spacing: 1px; }
    .sub-text { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #a5d6a7; }
    .edge-line { stroke-dasharray: 4 4; animation: flow 20s linear infinite; }
    @keyframes flow { from { stroke-dashoffset: 200; } to { stroke-dashoffset: 0; } }
    .float-1 { animation: float1 4s ease-in-out infinite alternate; }
    .float-2 { animation: float2 4.5s ease-in-out infinite alternate; }
    .float-3 { animation: float3 5s ease-in-out infinite alternate; }
    @keyframes float1 { from { transform: translateY(0); } to { transform: translateY(-6px); } }
    @keyframes float2 { from { transform: translateY(0); } to { transform: translateY(-8px); } }
    @keyframes float3 { from { transform: translateY(0); } to { transform: translateY(-5px); } }
  </style>

  <rect width="1100" height="520" fill="url(#bgGrad)" rx="14" stroke="#0c5a22" stroke-opacity="0.6"/>

  <!-- Top Title -->
  <text x="50" y="44" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#00ff41" letter-spacing="2px">◈ RADNEX ARCHITECTURE // MULTI-TIER COGNITIVE ENGINE</text>
  <text x="50" y="68" font-family="ui-monospace, monospace" font-size="12" fill="#0c5a22" letter-spacing="1px">ENGINEERED BY CHANDAN PANDEY (@thecnical) · HIGH-VELOCITY AUTONOMOUS CYBER OPS</text>

  <!-- LAYER 1: TUI & CONTROL INTERFACE (Isometric Projection) -->
  <g class="float-1" transform="translate(60, 100)">
    <!-- Plate -->
    <polygon points="120,20 480,20 380,110 20,110" fill="url(#planeGrad1)" stroke="#00ff41" stroke-width="1.5"/>
    <text x="70" y="55" class="node-text" fill="#7dffb0">LAYER 1: TUI &amp; INTERACTIVE COMMAND</text>
    <text x="70" y="75" class="sub-text">Live Rails · Multi-Pane Splitting · Matrix Engine · Scope Guards</text>
    <circle cx="50" cy="62" r="6" fill="#00ff41" filter="url(#neon)"/>
  </g>

  <!-- Flow Connector 1 -> 2 -->
  <path d="M 310,210 L 310,250" stroke="#00ff41" stroke-width="2" class="edge-line"/>
  <polygon points="305,250 315,250 310,258" fill="#00ff41"/>

  <!-- LAYER 2: HYBRID INTELLIGENCE & ROUTING (Isometric Projection) -->
  <g class="float-2" transform="translate(60, 240)">
    <polygon points="120,20 480,20 380,110 20,110" fill="url(#planeGrad2)" stroke="#00e5ff" stroke-width="1.5"/>
    <text x="70" y="55" class="node-text" fill="#00e5ff">LAYER 2: SMART ROUTER &amp; REASONING</text>
    <text x="70" y="75" class="sub-text">Scout + Architect · Shadow Checkpoints (/undo) · Ephemeral Caching</text>
    <circle cx="50" cy="62" r="6" fill="#00e5ff" filter="url(#neon)"/>
  </g>

  <!-- Flow Connector 2 -> 3 -->
  <path d="M 310,350 L 310,390" stroke="#00e5ff" stroke-width="2" class="edge-line"/>
  <polygon points="305,390 315,390 310,398" fill="#00e5ff"/>

  <!-- LAYER 3: ZERO-DOWNTIME GATEWAY MESH (Isometric Projection) -->
  <g class="float-3" transform="translate(60, 380)">
    <polygon points="120,20 480,20 380,110 20,110" fill="url(#planeGrad3)" stroke="#ffb000" stroke-width="1.5"/>
    <text x="70" y="55" class="node-text" fill="#ffb000">LAYER 3: ZERO-COST CLOUD GATEWAY MESH</text>
    <text x="70" y="75" class="sub-text">APInex · Radox AI · OpenRouter · UnoRouter · AIHubMix · TokenHarbour</text>
    <circle cx="50" cy="62" r="6" fill="#ffb000" filter="url(#neon)"/>
  </g>

  <!-- RIGHT PANEL: CAPABILITIES MATRIX (3D CARD) -->
  <g transform="translate(560, 110)">
    <rect width="480" height="360" rx="10" fill="#08100a" stroke="#0c5a22" stroke-width="1.2"/>
    <rect width="480" height="34" rx="10" fill="#0c1e10"/>
    <text x="20" y="23" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#7dffb0" letter-spacing="1.5px">⚡ CORE CAPABILITIES MATRIX</text>

    <!-- Item 1 -->
    <g transform="translate(20, 52)">
      <circle cx="10" cy="10" r="4" fill="#00ff41"/>
      <text x="24" y="14" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#ffffff">Strict Free-Tier Enforcer (is_strictly_free)</text>
      <text x="24" y="30" font-family="ui-monospace, monospace" font-size="11" fill="#0c5a22">Never incurs unintended charges. Automated failover on rate limits.</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(20, 114)">
      <circle cx="10" cy="10" r="4" fill="#00e5ff"/>
      <text x="24" y="14" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#ffffff">Dual-Tier Hybrid Dispatcher</text>
      <text x="24" y="30" font-family="ui-monospace, monospace" font-size="11" fill="#0c5a22">Lightning-fast scout for indexing + heavy architect for execution.</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(20, 176)">
      <circle cx="10" cy="10" r="4" fill="#ffb000"/>
      <text x="24" y="14" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#ffffff">Git Shadow Commits &amp; Instant Rollback (/undo)</text>
      <text x="24" y="30" font-family="ui-monospace, monospace" font-size="11" fill="#0c5a22">Every file mutation is checkpointed before disk writes occur.</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(20, 238)">
      <circle cx="10" cy="10" r="4" fill="#7dffb0"/>
      <text x="24" y="14" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#ffffff">Headless Webhook Reporting Engine (/webhook)</text>
      <text x="24" y="30" font-family="ui-monospace, monospace" font-size="11" fill="#0c5a22">Streams real-time findings to Discord, Slack, and SIEM webhooks.</text>
    </g>

    <!-- Item 5 -->
    <g transform="translate(20, 300)">
      <circle cx="10" cy="10" r="4" fill="#00ff41"/>
      <text x="24" y="14" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#ffffff">Full-Stack Scope &amp; Ethical Guardrails</text>
      <text x="24" y="30" font-family="ui-monospace, monospace" font-size="11" fill="#0c5a22">Explicit allow/deny target binding with zero lateral egress.</text>
    </g>
  </g>
</svg>
