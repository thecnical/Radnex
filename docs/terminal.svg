<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="1100" height="430" role="img" aria-label="RADNEX session">
  <defs>
    <clipPath id="tframe"><rect x="0" y="0" width="1100" height="430" rx="12"/></clipPath>
    <filter id="tglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .ln { font: 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
           animation: rise .5s ease-out backwards; }
    @keyframes rise { from { transform: translateY(8px); }
                       to   { transform: translateY(0); } }
    .cur { animation: blink 1.05s steps(1,end) infinite; }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .title { font: 700 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
              letter-spacing: 2px; fill: #7dffb0; }
    @media (prefers-reduced-motion: reduce) {
      .ln { animation: none; opacity: 1; } .cur { animation: none; }
    }
  </style>

  <g clip-path="url(#tframe)">
    <rect width="1100" height="430" fill="#040704"/>
    <rect width="1100" height="46" fill="#0a140c"/>
    <circle cx="28" cy="23" r="6.5" fill="#ff5f57"/>
    <circle cx="50" cy="23" r="6.5" fill="#febc2e"/>
    <circle cx="72" cy="23" r="6.5" fill="#28c840"/>
    <text class="title" x="550" y="28" text-anchor="middle">◈ RADNEX v1.0 — autonomous cyber shell</text>
    <line x1="0" y1="46" x2="1100" y2="46" stroke="#0c5a22" stroke-opacity="0.6"/>

    <text x="34" y="76" fill="#0c5a22" style="font:13px ui-monospace,Menlo,monospace;letter-spacing:1.4px">
      ◈ RADNEX   ◆ AUTO   ◆ deepseek-v4.1-flash   ▸ /home/thecnical   ◈ scope on   ⛨ sandbox on
    </text>

      <text class="ln" x="34" y="104" fill="#00ff41" style="animation-delay:0.55s">› recon the target, map endpoints, and test authorization boundary</text>
      <text class="ln" x="34" y="138" fill="#0c5a22" style="animation-delay:1.17s">  · routing through APInex + Radox AI mesh · ephemeral cache active</text>
      <text class="ln" x="34" y="172" fill="#7dffb0" style="animation-delay:1.79s">$ bash  nmap -sV -T4 --script http-enum,http-headers target.example.com</text>
      <text class="ln" x="34" y="206" fill="#00ff41" style="animation-delay:2.41s">  ✓ 4 services live · 12 endpoints discovered · 0 drops</text>
      <text class="ln" x="34" y="240" fill="#7dffb0" style="animation-delay:3.03s">$ write_file  assessment/attack-surface.md</text>
      <text class="ln" x="34" y="274" fill="#00ff41" style="animation-delay:3.65s">  ✓ shadow checkpoint captured [cf91a2] · diff applied +96 −0</text>
      <text class="ln" x="34" y="308" fill="#ffb000" style="animation-delay:4.27s">$ scout + architect · 0 latency stall · $0.0000 (100% free router)</text>

    <rect class="cur" x="36" y="330" width="9" height="17" fill="#00ff41" filter="url(#tglow)"/>

    <line x1="0" y1="388" x2="1100" y2="388" stroke="#0c5a22" stroke-opacity="0.6"/>
    <text x="34" y="413" fill="#0c5a22" style="font:13px ui-monospace,Menlo,monospace">
      ● router: apinex/radox [free]   |   tok ↑24.2k ↓810   |   $ 0.0000   |   turn 4   |   ● idle
    </text>
    <rect x="0.5" y="0.5" width="1099" height="429" rx="12" fill="none" stroke="#0c5a22" stroke-opacity="0.55"/>
  </g>
</svg>
